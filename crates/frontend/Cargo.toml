[package]
name = "smbcloud-ascapi-frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared operations behind the asc command line and MCP surfaces: credential resolution, result shaping, certificate issuance, and altool uploads."
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
smbcloud-ascapi-aso = { workspace = true }
smbcloud-ascapi-core = { workspace = true }
smbcloud-ascapi-play = { workspace = true }
smbcloud-ascapi-signing = { workspace = true }
tokio = { workspace = true, features = ["time"] }
