[package]
name = "smbcloud-ascapi-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing the App Store Connect operations from smbcloud-ascapi over stdio."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smbcloud-ascapi-aso = { workspace = true }
smbcloud-ascapi-core = { workspace = true }
smbcloud-ascapi-signing = { workspace = true }
smbcloud-ascapi-frontend = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
