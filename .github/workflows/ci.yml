name: Tests

# Runs on every push.
# Covers the Rust workspace: formatting, clippy, tests, and the rustdoc
# build (which catches broken intra-doc links, of which this crate has
# many).
on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Both hosts on purpose. The CSR tests shell out to `openssl` to verify
    # our output against an independent implementation, and the two runners
    # ship different ones: ubuntu has OpenSSL 3, macOS has LibreSSL. They
    # disagree on which stream the `verify OK` banner goes to, so a
    # single-host matrix would let a real portability bug through. macOS is
    # also where this crate's signing work ultimately has to run, since
    # keychain access exists nowhere else.
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other host on first failure: when a test fails on
      # exactly one of them, that difference is the most useful part of the
      # report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Report the openssl in use
        # Recorded because it decides how the CSR verification tests
        # behave, and it changes under us when GitHub bumps runner images.
        run: openssl version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build docs
        # Intra-doc links are load-bearing in this crate: the certificate
        # module's warnings about lost private keys point at the csr module
        # that explains them. A broken link silently drops that thread.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
