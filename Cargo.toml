[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/aso",
    "crates/signing",
    "crates/pricing",
    "crates/frontend",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Seto Elkahfi <seto@smbcloud.xyz>"]
license = "Apache-2.0"
repository = "https://github.com/smbcloudXYZ/smbcloud-ascapi"

[workspace.dependencies]
smbcloud-ascapi-core = { version = "0.1.0", path = "crates/core" }
smbcloud-ascapi-aso = { version = "0.1.0", path = "crates/aso" }
smbcloud-ascapi-signing = { version = "0.1.0", path = "crates/signing" }
smbcloud-ascapi-pricing = { version = "0.1.0", path = "crates/pricing" }
smbcloud-ascapi-frontend = { version = "0.1.0", path = "crates/frontend" }
smbcloud-ascapi-mcp = { version = "0.1.0", path = "crates/mcp" }
anyhow = "1"
clap = "4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
thiserror = "2.0"
tokio = "1"
async-trait = "0.1"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
rsa = "0.9"
rand = "0.8"
zeroize = { version = "1", features = ["alloc"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
